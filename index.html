<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Розклад</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Розклад">

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

:root{
--bg:#08090d;
--card:rgba(255,255,255,.055);
--border:rgba(255,255,255,.1);
--text:#f5f5f7;
--muted:#92949e;
--accent:#7c5cff;
--accent2:#a18eff;
--green:#32d583;
--red:#ff5d6c;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 15% 0%,rgba(124,92,255,.2),transparent 35%),
radial-gradient(circle at 90% 15%,rgba(72,167,255,.1),transparent 30%),
var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
overflow-x:hidden
}

button,input,select,textarea{font:inherit}

button{
border:0;
color:inherit;
cursor:pointer
}

.app{
max-width:760px;
margin:auto;
padding:env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom))
}

.header{
padding:22px 4px 14px;
display:flex;
justify-content:space-between;
align-items:center;
animation:down .5s ease
}

.header-title{
font-size:30px;
font-weight:800;
letter-spacing:-1px
}

.header-subtitle{
margin-top:3px;
color:var(--muted);
font-size:14px
}

.header-time{
color:var(--muted);
font-size:15px
}

.page{
display:none;
animation:page .3s ease
}

.page.active{display:block}

.hero{
position:relative;
overflow:hidden;
padding:24px;
min-height:290px;
border-radius:30px;
background:
linear-gradient(145deg,
rgba(124,92,255,.25),
rgba(255,255,255,.045) 55%,
rgba(72,167,255,.08));
border:1px solid var(--border);
box-shadow:0 20px 60px rgba(0,0,0,.35);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px)
}

.hero:before{
content:"";
position:absolute;
width:220px;
height:220px;
border-radius:50%;
background:rgba(124,92,255,.22);
filter:blur(60px);
right:-90px;
top:-90px;
animation:float 7s ease-in-out infinite
}

.hero-content{
position:relative;
z-index:2
}

.status{
display:inline-flex;
align-items:center;
gap:8px;
padding:7px 11px;
border-radius:100px;
background:rgba(255,255,255,.08);
color:#d8d5ff;
font-size:12px;
font-weight:700;
text-transform:uppercase
}

.status-dot{
width:7px;
height:7px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 14px var(--green);
animation:pulse 1.8s infinite
}

.hero-title{
margin:20px 0 5px;
font-size:32px;
font-weight:800;
letter-spacing:-1px
}

.hero-info{
color:var(--muted);
font-size:14px
}

.timer{
margin-top:18px;
font-size:48px;
line-height:1;
font-weight:800;
letter-spacing:-2px;
font-variant-numeric:tabular-nums
}

.progress-wrap{margin-top:20px}

.progress-bg{
height:8px;
background:rgba(255,255,255,.08);
border-radius:20px;
overflow:hidden
}

.progress{
height:100%;
width:0;
border-radius:20px;
background:linear-gradient(90deg,var(--accent),#a994ff);
transition:width .8s linear
}

.progress-times{
display:flex;
justify-content:space-between;
color:var(--muted);
font-size:12px;
margin-top:7px
}

.card{
margin-top:14px;
padding:18px;
border-radius:24px;
background:var(--card);
border:1px solid var(--border);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
animation:card .5s ease
}

.section-title{
font-size:18px;
font-weight:750;
margin-bottom:13px
}

.next-lesson{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.next-left{
display:flex;
align-items:center;
gap:13px
}

.lesson-number{
width:42px;
height:42px;
display:grid;
place-items:center;
border-radius:14px;
background:rgba(124,92,255,.15);
color:#b9aaff;
font-weight:800
}

.next-name{font-weight:700}

.next-time{
color:var(--muted);
font-size:13px;
margin-top:3px
}

.next-count{
color:var(--accent2);
font-weight:700;
white-space:nowrap
}

.day-tabs{
display:flex;
gap:7px;
overflow-x:auto;
padding:4px 1px 12px;
scrollbar-width:none
}

.day-tabs::-webkit-scrollbar{display:none}

.day-tab{
flex:1;
min-width:60px;
padding:11px 8px;
border-radius:15px;
background:var(--card);
color:var(--muted);
font-size:13px;
font-weight:700;
transition:.25s
}

.day-tab.active{
color:white;
background:var(--accent);
box-shadow:0 8px 25px rgba(124,92,255,.28)
}

.lesson-card{
display:flex;
gap:13px;
padding:16px;
margin-bottom:10px;
border-radius:20px;
background:var(--card);
border:1px solid var(--border);
animation:up .4s ease both
}

.lesson-num{
min-width:35px;
height:35px;
display:grid;
place-items:center;
border-radius:12px;
background:rgba(255,255,255,.06);
color:var(--muted);
font-weight:800
}

.lesson-main{flex:1}

.lesson-name{font-weight:700}

.lesson-time{
margin-top:5px;
color:var(--muted);
font-size:13px
}

.lesson-actions{
display:flex;
align-items:center
}

.delete-btn{
width:36px;
height:36px;
border-radius:11px;
background:rgba(255,255,255,.06);
color:var(--muted);
font-size:20px
}

.delete-btn:active{transform:scale(.9)}

.add-btn{
width:100%;
margin-top:5px;
padding:15px;
border-radius:18px;
background:linear-gradient(135deg,var(--accent),#6546e8);
font-weight:750;
box-shadow:0 10px 30px rgba(124,92,255,.25);
transition:.2s
}

.add-btn:active{transform:scale(.97)}

.homework-day{margin-bottom:18px}

.homework-day-title{
color:var(--muted);
font-size:13px;
font-weight:700;
margin:0 0 8px 4px;
text-transform:uppercase
}

.homework-item{
display:flex;
gap:12px;
align-items:center;
padding:14px;
margin-bottom:8px;
border-radius:18px;
background:var(--card);
border:1px solid var(--border)
}

.check{
width:24px;
height:24px;
border-radius:50%;
border:2px solid rgba(255,255,255,.22);
display:grid;
place-items:center;
flex-shrink:0
}

.homework-item.done .check{
background:var(--green);
border-color:var(--green);
color:#06120c
}

.homework-item.done .hw-text{
text-decoration:line-through;
opacity:.45
}

.hw-main{flex:1}

.hw-subject{
font-size:12px;
color:var(--accent2);
font-weight:700
}

.hw-text{
margin-top:3px;
font-size:14px;
line-height:1.35
}

.field{margin-bottom:14px}

.field label{
display:block;
color:var(--muted);
font-size:12px;
font-weight:700;
margin:0 0 7px 4px
}

input{
width:100%;
padding:14px;
color:var(--text);
background:rgba(255,255,255,.055);
border:1px solid var(--border);
border-radius:16px;
outline:none
}

input:focus{
border-color:rgba(124,92,255,.7);
box-shadow:0 0 0 3px rgba(124,92,255,.1)
}

.nav{
position:fixed;
z-index:100;
left:50%;
bottom:calc(12px + env(safe-area-inset-bottom));
transform:translateX(-50%);
width:min(92%,560px);
display:flex;
padding:7px;
gap:5px;
border-radius:23px;
background:rgba(20,20,26,.82);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 15px 50px rgba(0,0,0,.5);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px)
}

.nav-btn{
flex:1;
padding:10px 5px;
border-radius:17px;
background:transparent;
color:var(--muted);
transition:.25s
}

.nav-icon{
display:block;
font-size:19px;
margin-bottom:2px
}

.nav-text{
display:block;
font-size:10px;
font-weight:700
}

.nav-btn.active{
color:white;
background:rgba(124,92,255,.18)
}

.empty{
text-align:center;
padding:35px 15px;
color:var(--muted)
}

.empty-icon{
font-size:42px;
margin-bottom:8px
}

.toast{
position:fixed;
z-index:300;
left:50%;
top:calc(15px + env(safe-area-inset-top));
transform:translate(-50%,-150%);
padding:13px 18px;
border-radius:16px;
background:rgba(30,30,37,.95);
border:1px solid var(--border);
box-shadow:0 20px 60px rgba(0,0,0,.35);
font-size:14px;
font-weight:650;
transition:.4s
}

.toast.show{
transform:translate(-50%,0)
}

@keyframes down{
from{opacity:0;transform:translateY(-15px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes page{
from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes card{
from{opacity:0;transform:translateY(15px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes up{
from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:translateY(0)}
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.35)}
}

@keyframes float{
0%,100%{transform:translate(0,0)}
50%{transform:translate(-15px,15px)}
}

@media(max-width:430px){
.hero{
min-height:275px;
padding:21px;
border-radius:27px
}

.hero-title{font-size:29px}
.timer{font-size:43px}
.header-title{font-size:27px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div>
<div class="header-title">Розклад</div>
<div class="header-subtitle" id="dateText">Завантаження...</div>
</div>
<div class="header-time" id="clock">--:--</div>
</header>

<main id="page-home" class="page active">

<section class="hero">
<div class="hero-content">

<div class="status">
<span class="status-dot"></span>
<span id="statusText">Завантаження</span>
</div>

<div class="hero-title" id="currentSubject">—</div>

<div class="hero-info" id="currentInfo">
Перевіряємо розклад...
</div>

<div class="timer" id="mainTimer">00:00</div>

<div class="progress-wrap">
<div class="progress-bg">
<div class="progress" id="mainProgress"></div>
</div>

<div class="progress-times">
<span id="progressStart">--:--</span>
<span id="progressEnd">--:--</span>
</div>
</div>

</div>
</section>

<section class="card">

<div class="section-title">Далі</div>

<div class="next-lesson">

<div class="next-left">

<div class="lesson-number" id="nextNumber">—</div>

<div>
<div class="next-name" id="nextName">—</div>
<div class="next-time" id="nextTime">—</div>
</div>

</div>

<div class="next-count" id="nextCount">—</div>

</div>

</section>

</main>

<main id="page-schedule" class="page">

<div class="day-tabs" id="dayTabs"></div>

<div id="scheduleList"></div>

<button class="add-btn" id="addLessonBtn">
＋ Додати урок
</button>

</main>

<main id="page-homework" class="page">

<section class="card">

<div class="section-title">Домашнє завдання</div>

<button class="add-btn" id="addHomeworkBtn">
＋ Додати домашнє
</button>

</section>

<div id="homeworkList"></div>

</main>

<main id="page-settings" class="page">

<section class="card">

<div class="section-title">⚙️ Налаштування</div>

<div class="field">
<label>Початок першого уроку</label>
<input type="time" id="startTime">
</div>

<div class="field">
<label>Тривалість уроку, хв</label>
<input type="number" id="lessonDuration" min="1">
</div>

<div class="field">
<label>Звичайна перерва, хв</label>
<input type="number" id="breakDuration" min="0">
</div>

<button class="add-btn" id="saveSettingsBtn">
Зберегти налаштування
</button>

</section>

</main>

</div>

<nav class="nav">

<button class="nav-btn active" data-page="home">
<span class="nav-icon">⌂</span>
<span class="nav-text">Головна</span>
</button>

<button class="nav-btn" data-page="schedule">
<span class="nav-icon">▦</span>
<span class="nav-text">Розклад</span>
</button>

<button class="nav-btn" data-page="homework">
<span class="nav-icon">✓</span>
<span class="nav-text">Домашка</span>
</button>

<button class="nav-btn" data-page="settings">
<span class="nav-icon">⚙</span>
<span class="nav-text">Налаштування</span>
</button>

</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================
   DATA
========================= */

const STORAGE_KEY = "schoolScheduleV5";

const defaultData = {
settings:{
start:"08:30",
lessonDuration:45,
breakDuration:10
},

schedule:{
"Понеділок":[],
"Вівторок":[],
"Середа":[],
"Четвер":[],
"П’ятниця":[]
},

homework:[]
};

let data;

try{
const saved=localStorage.getItem(STORAGE_KEY);
data=saved?JSON.parse(saved):defaultData;
}catch(e){
data=JSON.parse(JSON.stringify(defaultData));
}

if(!data.settings)data.settings={...defaultData.settings};
if(!data.schedule)data.schedule={...defaultData.schedule};
if(!data.homework)data.homework=[];

const days=[
"Понеділок",
"Вівторок",
"Середа",
"Четвер",
"П’ятниця"
];

const shortDays=["Пн","Вт","Ср","Чт","Пт"];

let selectedDay=getTodayName();

/* =========================
   BASIC
========================= */

function saveData(){
try{
localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}catch(e){}
}

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function getTodayName(){
const d=new Date().getDay();

if(d===0||d===6)return "Понеділок";

return days[d-1];
}

function minutesFromTime(time){
if(!time)return 0;

const parts=time.split(":");
return Number(parts[0])*60+Number(parts[1]);
}

function timeFromMinutes(minutes){
minutes=((minutes%1440)+1440)%1440;

const h=Math.floor(minutes/60);
const m=minutes%60;

return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}

function formatSeconds(seconds){
seconds=Math.max(0,Math.floor(seconds));

const m=Math.floor(seconds/60);
const s=seconds%60;

return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function toast(text){
const el=document.getElementById("toast");

el.textContent=text;
el.classList.add("show");

setTimeout(()=>{
el.classList.remove("show");
},2200);
}

/* =========================
   LESSON TIMES
========================= */

function getLessonTimes(day){

const lessons=data.schedule[day]||[];

let current=minutesFromTime(data.settings.start);

const result=[];

for(let i=0;i<lessons.length;i++){

if(current>=750&&current<780){
current=780;
}

let start=current;

let end=start+Number(data.settings.lessonDuration);

if(start<750&&end>750){
end=750;
}

result.push({
index:i,
name:lessons[i].name||"",
start:start,
end:end
});

current=end;

if(current===750){
current=780;
}else{
current+=Number(data.settings.breakDuration);
}
}

return result;
}

/* =========================
   CLOCK
========================= */

function updateClock(){

const now=new Date();

document.getElementById("clock").textContent=
now.toLocaleTimeString("uk-UA",{
hour:"2-digit",
minute:"2-digit"
});

document.getElementById("dateText").textContent=
now.toLocaleDateString("uk-UA",{
weekday:"long",
day:"numeric",
month:"long"
});
}

/* =========================
   HOME
========================= */

function updateMain(){

const now=new Date();

const currentMinutes=
now.getHours()*60+
now.getMinutes()+
now.getSeconds()/60;

const realDay=now.getDay();
const day=getTodayName();
const lessons=getLessonTimes(day);

const status=document.getElementById("statusText");
const subject=document.getElementById("currentSubject");
const info=document.getElementById("currentInfo");
const timer=document.getElementById("mainTimer");
const progress=document.getElementById("mainProgress");

const start=document.getElementById("progressStart");
const end=document.getElementById("progressEnd");

if(realDay===0||realDay===6){

status.textContent="Вихідний";
subject.textContent="Відпочивай 😎";
info.textContent="Сьогодні уроків немає";
timer.textContent="🎉";
progress.style.width="0%";
start.textContent="";
end.textContent="";

updateNext(null,lessons);

return;
}

if(currentMinutes>=750&&currentMinutes<780){

status.textContent="Велика перерва";
subject.textContent="☕ Відпочивай";
info.textContent="12:30 — 13:00";

timer.textContent=
formatSeconds((780-currentMinutes)*60);

progress.style.width=
((currentMinutes-750)/30*100)+"%";

start.textContent="12:30";
end.textContent="13:00";

updateNext(null,lessons,true);

return;
}

let current=null;
let next=null;

for(let i=0;i<lessons.length;i++){

const lesson=lessons[i];

if(currentMinutes>=lesson.start&&currentMinutes<lesson.end){

current=lesson;
next=lessons[i+1]||null;
break;
}

if(currentMinutes<lesson.start){

next=lesson;
break;
}
}

if(current){

status.textContent="Зараз урок";
subject.textContent=
current.name||`Урок ${current.index+1}`;

info.textContent=
timeFromMinutes(current.start)+" — "+
timeFromMinutes(current.end);

timer.textContent=
formatSeconds((current.end-currentMinutes)*60);

const percent=
(currentMinutes-current.start)/
(current.end-current.start)*100;

progress.style.width=
Math.max(0,Math.min(100,percent))+"%";

start.textContent=timeFromMinutes(current.start);
end.textContent=timeFromMinutes(current.end);

updateNext(current,lessons);

return;
}

if(next){

status.textContent="Перерва";
subject.textContent="☕ Перерва";
info.textContent=
`До ${timeFromMinutes(next.start)}`;

timer.textContent=
formatSeconds((next.start-currentMinutes)*60);

progress.style.width="0%";

start.textContent="";
end.textContent=timeFromMinutes(next.start);

updateNext(null,lessons);

return;
}

status.textContent="Уроки закінчились";
subject.textContent="🏠 Можна додому";
info.textContent="На сьогодні все";
timer.textContent="00:00";
progress.style.width="100%";
start.textContent="";
end.textContent="";

updateNext(null,lessons);
}

/* =========================
   NEXT
========================= */

function updateNext(current,lessons,bigBreak=false){

const number=document.getElementById("nextNumber");
const name=document.getElementById("nextName");
const time=document.getElementById("nextTime");
const count=document.getElementById("nextCount");

let next=null;

if(bigBreak){
next=lessons.find(x=>x.start>=780);
}else if(current){
next=lessons.find(x=>x.index===current.index+1);
}else{

const now=new Date();

const mins=
now.getHours()*60+
now.getMinutes()+
now.getSeconds()/60;

next=lessons.find(x=>x.start>mins);
}

if(!next){

number.textContent="✓";
name.textContent="На сьогодні все";
time.textContent="";
count.textContent="";
return;
}

number.textContent=next.index+1;
name.textContent=next.name||`Урок ${next.index+1}`;
time.textContent=timeFromMinutes(next.start);

const now=new Date();

const mins=
now.getHours()*60+
now.getMinutes()+
now.getSeconds()/60;

count.textContent=
formatSeconds((next.start-mins)*60);
}

/* =========================
   NAVIGATION
========================= */

function showPage(page,button){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});

const target=document.getElementById("page-"+page);

if(target)target.classList.add("active");

document.querySelectorAll(".nav-btn").forEach(b=>{
b.classList.remove("active");
});

if(button)button.classList.add("active");

if(page==="schedule")renderSchedule();
if(page==="homework")renderHomework();
if(page==="settings")loadSettings();
}

/* =========================
   SCHEDULE
========================= */

function renderDayTabs(){

const box=document.getElementById("dayTabs");

box.innerHTML="";

days.forEach((day,i)=>{

const btn=document.createElement("button");

btn.className="day-tab";

if(day===selectedDay){
btn.classList.add("active");
}

btn.textContent=shortDays[i];

btn.addEventListener("click",function(){

selectedDay=day;

renderDayTabs();
renderScheduleList();

});

box.appendChild(btn);
});
}

function renderSchedule(){
renderDayTabs();
renderScheduleList();
}

function renderScheduleList(){

const box=document.getElementById("scheduleList");

const lessons=data.schedule[selectedDay]||[];

if(!lessons.length){

box.innerHTML=`
<div class="card empty">
<div class="empty-icon">📚</div>
<div>Уроків поки немає</div>
</div>`;

return;
}

const times=getLessonTimes(selectedDay);

box.innerHTML=lessons.map((lesson,index)=>{

const t=times[index];

return`
<div class="lesson-card">

<div class="lesson-num">${index+1}</div>

<div class="lesson-main">

<div class="lesson-name">
${escapeHTML(lesson.name)}
</div>

<div class="lesson-time">
${timeFromMinutes(t.start)} — ${timeFromMinutes(t.end)}
</div>

</div>

<div class="lesson-actions">

<button
class="delete-btn"
data-delete-lesson="${index}">
×
</button>

</div>

</div>`;

}).join("");

box.querySelectorAll("[data-delete-lesson]").forEach(btn=>{

btn.addEventListener("click",function(){

const index=Number(this.dataset.deleteLesson);

if(!confirm("Видалити цей урок?"))return;

data.schedule[selectedDay].splice(index,1);

saveData();
renderSchedule();
updateMain();

toast("Урок видалено");

});
});
}

/* =========================
   ADD LESSON
========================= */

function addLesson(){

const name=prompt(
`Новий урок — ${selectedDay}\n\nВведи назву предмета:`
);

if(!name||!name.trim())return;

if(!data.schedule[selectedDay]){
data.schedule[selectedDay]=[];
}

data.schedule[selectedDay].push({
name:name.trim()
});

saveData();

renderSchedule();
updateMain();

toast("Урок додано ✓");
}

/* =========================
   HOMEWORK
========================= */

function addHomework(){

const dayInput=prompt(
"День тижня:\nПн / Вт / Ср / Чт / Пт"
);

if(!dayInput)return;

const map={
"пн":"Понеділок",
"вт":"Вівторок",
"ср":"Середа",
"чт":"Четвер",
"пт":"П’ятниця"
};

const fullDay=
map[dayInput.trim().toLowerCase()]||
dayInput.trim();

if(!days.includes(fullDay)){

toast("Невірний день");
return;
}

const subject=prompt("Предмет:");

if(!subject||!subject.trim())return;

const task=prompt("Що задано?");

if(!task||!task.trim())return;

data.homework.push({
id:Date.now(),
day:fullDay,
subject:subject.trim(),
task:task.trim(),
done:false
});

saveData();

renderHomework();

toast("Домашнє додано ✓");
}

function renderHomework(){

const box=document.getElementById("homeworkList");

if(!data.homework.length){

box.innerHTML=`
<div class="card empty">
<div class="empty-icon">🎒</div>
<div>Домашніх завдань поки немає</div>
</div>`;

return;
}

let html="";

days.forEach(day=>{

const items=data.homework.filter(x=>x.day===day);

if(!items.length)return;

html+=`
<section class="homework-day">

<div class="homework-day-title">
${day}
</div>`;

items.forEach(item=>{

html+=`
<div class="homework-item ${item.done?"done":""}"
data-homework-id="${item.id}">

<div class="check">
${item.done?"✓":""}
</div>

<div class="hw-main">

<div class="hw-subject">
${escapeHTML(item.subject)}
</div>

<div class="hw-text">
${escapeHTML(item.task)}
</div>

</div>

<button
class="delete-btn"
data-delete-homework="${item.id}">
×
</button>

</div>`;
});

html+=`</section>`;
});

box.innerHTML=html;

box.querySelectorAll("[data-homework-id]").forEach(item=>{

item.addEventListener("click",function(e){

if(e.target.closest("[data-delete-homework]"))return;

const id=Number(this.dataset.homeworkId);

const hw=data.homework.find(x=>x.id===id);

if(!hw)return;

hw.done=!hw.done;

saveData();
renderHomework();

});
});

box.querySelectorAll("[data-delete-homework]").forEach(btn=>{

btn.addEventListener("click",function(e){

e.stopPropagation();

const id=Number(this.dataset.deleteHomework);

data.homework=
data.homework.filter(x=>x.id!==id);

saveData();
renderHomework();

toast("Домашнє видалено");

});
});
}

/* =========================
   SETTINGS
========================= */

function loadSettings(){

document.getElementById("startTime").value=
data.settings.start||"08:30";

document.getElementById("lessonDuration").value=
data.settings.lessonDuration||45;

document.getElementById("breakDuration").value=
data.settings.breakDuration??10;
}

function saveSettings(){

const start=document.getElementById("startTime").value;

const lessonDuration=
Number(document.getElementById("lessonDuration").value);

const breakDuration=
Number(document.getElementById("breakDuration").value);

if(!start||lessonDuration<1||breakDuration<0){

toast("Перевір налаштування");
return;
}

data.settings.start=start;
data.settings.lessonDuration=lessonDuration;
data.settings.breakDuration=breakDuration;

saveData();

updateMain();
renderSchedule();

toast("Налаштування збережено ✓");
}

/* =========================
   BUTTON EVENTS
========================= */

document.querySelectorAll(".nav-btn").forEach(button=>{

button.addEventListener("click",function(){

showPage(this.dataset.page,this);

});
});

document.getElementById("addLessonBtn")
.addEventListener("click",addLesson);

document.getElementById("addHomeworkBtn")
.addEventListener("click",addHomework);

document.getElementById("saveSettingsBtn")
.addEventListener("click",saveSettings);

/* =========================
   START
========================= */

updateClock();
updateMain();

setInterval(function(){

updateClock();
updateMain();

},1000);

/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

window.addEventListener("load",function(){

navigator.serviceWorker
.register("./sw.js")
.catch(function(){});

});
}
</script>

</body>
</html>
